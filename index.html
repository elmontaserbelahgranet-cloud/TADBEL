<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بابا المجال - أداة مضاعفة الملفات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f1013; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }

        /* طبقة التمويه (Smart Blur) */
        .bg-blur {
            position: fixed;
            top: -5%; left: -5%; right: -5%; bottom: -5%; 
            background-image: url('image_eedd30.png');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.35); 
            z-index: 1;
        }

        /* طبقة الصورة الأساسية */
        .bg-clear {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_eedd30.png');
            background-size: contain; 
            background-position: center top 5%;
            background-repeat: no-repeat;
            z-index: 2;
        }

        /* المربع الزجاجي للأداة */
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 88%;
            max-width: 380px; 
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 3;
            position: relative;
            margin-top: 30vh; 
        }

        h1 {
            color: #b38b4d;
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            color: #000;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 15px;
            color: #000;
        }

        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            font-family: inherit;
            transition: border-color 0.3s;
            color: #333;
        }

        input[type="file"]::file-selector-button {
            font-family: 'Tajawal', sans-serif;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        input[type="file"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #b38b4d;
        }

        button {
            background-color: #a67c3a;
            color: #fff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        button:hover {
            background-color: #8c6830;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            color: #fff;
            font-size: 13px;
            z-index: 3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        @media (max-width: 350px) {
            h1 { font-size: 32px; }
            h2 { font-size: 16px; }
            .glass-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>
    <div class="bg-clear"></div>

    <div class="glass-card">
        <h1>بابا المجال</h1>
        <h2>أداة معالجة الملفات (CRLF)</h2>

        <div class="input-group">
            <label for="fileInput">قم برفع الملف هنا:</label>
            <input type="file" id="fileInput">
        </div>

        <div class="input-group">
            <label for="multiplier">عدد مرات النسخ (CRLF):</label>
            <!-- القيمة الافتراضية بقت 1 علشان ينزل ملف واحد على الأقل -->
            <input type="number" id="multiplier" min="1" value="1">
        </div>

        <button onclick="processFile()">تنفيذ وتحميل الملفات</button>
    </div>

    <div class="footer">
        © 2026 بابا المجال. جميع الحقوق محفوظة.
    </div>

    <script>
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const multiplierInput = document.getElementById('multiplier').value;
            const multiplier = parseInt(multiplierInput) || 1;

            if (fileInput.files.length === 0) {
                alert('يرجى اختيار ملف أولاً.');
                return;
            }
            
            if (multiplier < 1) {
                alert('يرجى إدخال رقم 1 أو أكثر.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // قراءة الملف كـ ArrayBuffer للحفاظ على التشفير
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const view = new Uint8Array(arrayBuffer);
                
                let extraBytes = 0;
                for (let i = 0; i < view.length; i++) {
                    if (view[i] === 10) { 
                        if (i === 0 || view[i - 1] !== 13) { 
                            extraBytes++;
                        }
                    }
                }
                
                const newView = new Uint8Array(view.length + extraBytes);
                let j = 0;
                for (let i = 0; i < view.length; i++) {
                    if (view[i] === 10 && (i === 0 || view[i - 1] !== 13)) {
                        newView[j++] = 13; 
                    }
                    newView[j++] = view[i]; 
                }

                const blob = new Blob([newView], { type: 'application/octet-stream' });
                const originalName = file.name;

                // التعديل الجديد: تحميل ملفات متعددة بشكل مستقل بناءً على الرقم المدخل
                for (let i = 1; i <= multiplier; i++) {
                    // استخدام setTimeout لعمل فاصل زمني (نصف ثانية) بين كل تحميل
                    // علشان المتصفح ميعتبرهاش Spam ويمنع التحميل المتعدد
                    setTimeout(() => {
                        let namePrefix = '';
                        for (let k = 0; k < i; k++) {
                            namePrefix += 'CRLF_';
                        }
                        
                        const newName = namePrefix + originalName;
                        const downloadUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        
                        a.href = downloadUrl;
                        a.download = newName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        
                        // تنظيف الذاكرة بعد التحميل
                        setTimeout(() => URL.revokeObjectURL(downloadUrl), 100);
                    }, i * 500); // زيادة الوقت لكل ملف
                }
            };

            reader.onerror = function() {
                alert('حدث خطأ أثناء قراءة الملف.');
            };

            reader.readAsArrayBuffer(file);
        }
    </script>

</body>
</html>
