<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بابا المجال - أداة نسخ ومعالجة ملفات الرواتب</title>
    <!-- استدعاء خط تجوال وخط أميري -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f1013; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }

        /* طبقة التمويه */
        .bg-blur {
            position: fixed;
            top: -5%; left: -5%; right: -5%; bottom: -5%; 
            background-image: url('image_eedd30.png');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.35); 
            z-index: 1;
        }

        /* طبقة الصورة الأساسية */
        .bg-clear {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_eedd30.png');
            background-size: contain; 
            background-position: center top 5%;
            background-repeat: no-repeat;
            z-index: 2;
        }

        /* === كود النسر الطائر === */
        .flying-eagle {
            position: fixed;
            width: 140px; /* حجم النسر */
            z-index: 100; /* لجعله يطير فوق العناصر */
            pointer-events: none; /* لمنع تفاعل الماوس معه حتى لا يعيق الضغط على الأزرار */
            border-radius: 50%; /* لجعل الصورة دائرية */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); /* إضافة ظل جمالي */
            animation: flyAcross 15s linear infinite; /* حركة لمدة 15 ثانية وتتكرر بلا توقف */
        }

        /* مسار حركة النسر (يطير من اليمين لليسار مع تموجات) */
        @keyframes flyAcross {
            0% {
                right: -150px;
                top: 15%;
                transform: translateY(0px) rotate(-15deg);
            }
            25% {
                transform: translateY(40px) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(15deg);
            }
            75% {
                transform: translateY(20px) rotate(0deg);
            }
            100% {
                right: 110vw; /* يعبر الشاشة بالكامل */
                top: 25%;
                transform: translateY(0px) rotate(-15deg);
            }
        }
        /* ======================== */

        /* المربع الزجاجي */
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 88%;
            max-width: 380px; 
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 3;
            position: relative;
            margin-top: 15vh; 
        }

        h1 {
            color: #b38b4d;
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* --- التصميم الملكي --- */
        .crowned-text {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(166, 124, 58, 0.4);
        }

        .crown-emoji {
            font-size: 40px;
            display: block;
            margin-bottom: -12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 2;
            position: relative;
        }

        .royal-title-card {
            font-family: 'Amiri', serif;
            color: #a67c3a;
            font-size: 26px;
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .royal-phone-card {
            font-family: 'Tajawal', sans-serif;
            color: #000;
            font-size: 22px;
            font-weight: 800;
            margin: 5px 0 0 0;
            letter-spacing: 2px;
        }
        /* ------------------------------------------- */

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
            color: #000;
        }

        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            font-family: inherit;
            transition: border-color 0.3s;
            color: #333;
        }

        .radio-group {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        .radio-group label {
            cursor: pointer;
            display: inline;
            margin-right: 5px;
        }

        input[type="file"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #b38b4d;
        }

        button {
            background-color: #a67c3a;
            color: #fff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            font-family: inherit;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        button:hover {
            background-color: #8c6830;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            color: #fff;
            font-size: 13px;
            z-index: 3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-top: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>
    <div class="bg-clear"></div>

    <!-- لوجو النسر الطائر -->
    <img src="ee4c5e29-b649-4c87-b92f-35ae37258e1c.jpeg" alt="لوجو النسر" class="flying-eagle">

    <div class="glass-card">
        <h1>بابا المجال</h1>
        <h2>أداة نسخ وتجهيز خطوط الرواتب</h2>

        <div class="crowned-text">
            <span class="crown-emoji">👑</span>
            <h3 class="royal-title-card">الإنجاز رقم 1 فى المملكة</h3>
            <p class="royal-phone-card" dir="ltr">0545098312</p>
        </div>

        <form id="converterform" onsubmit="event.preventDefault(); convertFile();">
            <div class="radio-group">
                <div>
                    <input type="radio" id="crlf-radio" name="method" value="crlf" checked>
                    <label for="crlf-radio">LF to CRLF</label>
                </div>
                <div>
                    <input type="radio" id="lf-radio" name="method" value="lf">
                    <label for="lf-radio">CRLF to LF</label>
                </div>
            </div>

            <div class="input-group">
                <label for="numFiles">عدد الملفات المطلوبة (نسخ):</label>
                <input type="number" id="numFiles" min="1" value="1" required>
            </div>

            <div class="input-group">
                <label for="fileInput">قم برفع الملف الأساسي هنا:</label>
                <input type="file" id="fileInput" required>
            </div>

            <button type="submit">توليد وتحميل الملفات</button>
        </form>
    </div>

    <div class="footer">
        © 2026 بابا المجال. جميع الحقوق محفوظة.
    </div>

    <script>
        async function convertFile() {
            const fileInput = document.getElementById('fileInput');
            const numFiles = parseInt(document.getElementById('numFiles').value) || 1;
            const method = document.querySelector('input[name="method"]:checked').value;
            const file = fileInput.files[0];
            
            if (!file) {
                alert('يرجى اختيار ملف أولاً.');
                return;
            }

            const reader = new FileReader();

            reader.onload = async function(e) {
                let baseText = e.target.result;
                
                // توحيد جميع نهايات الأسطر الأصلية لضمان عدم تلف البيانات
                baseText = baseText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                if (method === 'crlf') {
                    baseText = baseText.replace(/\n/g, '\r\n');
                }

                // تحديد شكل السطر الفارغ المطلوب إضافته في نهاية الملف
                const newlineChar = (method === 'crlf') ? '\r\n' : '\n';

                // توليد عدد الملفات المطلوبة
                for (let i = 1; i <= numFiles; i++) {
                    // كل ملف جديد بياخد عدد سطور فارغة في نهايته يساوي رقم النسخة (i)
                    let extraLines = newlineChar.repeat(i);
                    let finalConvertedText = baseText + extraLines;

                    const outputBlob = new Blob([finalConvertedText], { type: 'text/plain' });
                    const downloadUrl = URL.createObjectURL(outputBlob);
                    
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    
                    // تسمية الملف برقم النسخة عشان تميزهم بسهولة
                    let prefix = (method === 'crlf' ? 'CRLF_' : 'LF_');
                    a.download = prefix + `Copy${i}_` + file.name;
                    
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    setTimeout(() => URL.revokeObjectURL(downloadUrl), 100);
                    
                    // تأخير بسيط 300 ملي ثانية بين كل ملف عشان المتصفح يقدر يحملهم كلهم وميهنجش
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
            };

            reader.onerror = function() {
                alert('حدث خطأ أثناء قراءة الملف.');
            };

            // قراءة الملف كنص لتسهيل إضافة السطور
            reader.readAsText(file);
        }
    </script>

</body>
</html>
