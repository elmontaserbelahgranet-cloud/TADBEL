<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بابا المجال - تدبيل ملفات الرواتب</title>
    <!-- استدعاء خط تجوال وخط أميري -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f1013; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            margin: 0;
        }

        /* طبقة التمويه */
        .bg-blur {
            position: fixed;
            top: -5%; left: -5%; right: -5%; bottom: -5%; 
            background-image: url('image_eedd30.png');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.35); 
            z-index: 1;
        }

        /* طبقة الصورة الأساسية */
        .bg-clear {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('image_eedd30.png');
            background-size: contain; 
            background-position: center top 5%;
            background-repeat: no-repeat;
            z-index: 2;
        }

        /* المربع الزجاجي */
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 88%;
            max-width: 380px; 
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 3;
            position: relative;
            margin-top: 25vh; 
        }

        h1 {
            color: #b38b4d;
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* --- التصميم الملكي الجديد فوق صندوق الإدخال --- */
        .crowned-text {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed rgba(166, 124, 58, 0.4); /* خط ذهبي متقطع يفصل بينها وبين الأداة */
        }

        .crown-emoji {
            font-size: 45px; /* تاج كبير */
            display: block;
            margin-bottom: -15px; /* سحب التاج لأسفل ليلبس الكلمة */
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 2;
            position: relative;
        }

        .royal-title-card {
            font-family: 'Amiri', serif; /* خط ملكي */
            color: #a67c3a; /* لون ذهبي */
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .royal-phone-card {
            font-family: 'Tajawal', sans-serif;
            color: #000;
            font-size: 24px;
            font-weight: 800;
            margin: 5px 0 0 0;
            letter-spacing: 2px;
        }
        /* ------------------------------------------- */

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 15px;
            color: #000;
        }

        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            font-family: inherit;
            transition: border-color 0.3s;
            color: #333;
        }

        input[type="file"]::file-selector-button {
            font-family: 'Tajawal', sans-serif;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        input[type="file"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #b38b4d;
        }

        button {
            background-color: #a67c3a;
            color: #fff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        button:hover {
            background-color: #8c6830;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            color: #fff;
            font-size: 13px;
            z-index: 3;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        @media (max-width: 350px) {
            h1 { font-size: 32px; }
            .royal-title-card { font-size: 24px; }
            .royal-phone-card { font-size: 20px; }
            .crown-emoji { font-size: 35px; margin-bottom: -10px; }
            .glass-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>
    <div class="bg-clear"></div>

    <div class="glass-card">
        <h1>بابا المجال</h1>
        <h2>أداة معالجة الملفات (CRLF)</h2>

        <!-- القسم الملكي فوق صندوق الإدخال مباشرة -->
        <div class="crowned-text">
            <span class="crown-emoji">👑</span>
            <h3 class="royal-title-card">الإنجاز رقم 1 فى المملكة</h3>
            <p class="royal-phone-card" dir="ltr">0545098312</p>
        </div>

        <div class="input-group">
            <label for="fileInput">قم برفع الملف هنا:</label>
            <input type="file" id="fileInput">
        </div>

        <div class="input-group">
            <label for="multiplier">أكتب عاوز كام ملف:</label>
            <input type="number" id="multiplier" min="1" value="1">
        </div>

        <button onclick="processFile()">تنفيذ وتحميل الملفات</button>
    </div>

    <div class="footer">
        © 2026 بابا المجال. جميع الحقوق محفوظة.
    </div>

    <script>
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const multiplierInput = document.getElementById('multiplier').value;
            const multiplier = parseInt(multiplierInput) || 1;

            if (fileInput.files.length === 0) {
                alert('يرجى اختيار ملف أولاً.');
                return;
            }
            
            if (multiplier < 1) {
                alert('يرجى إدخال رقم 1 أو أكثر.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const view = new Uint8Array(arrayBuffer);
                
                let extraBytes = 0;
                for (let i = 0; i < view.length; i++) {
                    if (view[i] === 10) { 
                        if (i === 0 || view[i - 1] !== 13) { 
                            extraBytes++;
                        }
                    }
                }
                
                const newView = new Uint8Array(view.length + extraBytes);
                let j = 0;
                for (let i = 0; i < view.length; i++) {
                    if (view[i] === 10 && (i === 0 || view[i - 1] !== 13)) {
                        newView[j++] = 13; 
                    }
                    newView[j++] = view[i]; 
                }

                const blob = new Blob([newView], { type: 'application/octet-stream' });
                const originalName = file.name;

                for (let i = 1; i <= multiplier; i++) {
                    setTimeout(() => {
                        let namePrefix = '';
                        for (let k = 0; k < i; k++) {
                            namePrefix += 'CRLF_';
                        }
                        
                        const newName = namePrefix + originalName;
                        const downloadUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        
                        a.href = downloadUrl;
                        a.download = newName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        
                        setTimeout(() => URL.revokeObjectURL(downloadUrl), 100);
                    }, i * 500); 
                }
            };

            reader.onerror = function() {
                alert('حدث خطأ أثناء قراءة الملف.');
            };

            reader.readAsArrayBuffer(file);
        }
    </script>

</body>
</html>
