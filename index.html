<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بابا المجال - أداة مضاعفة الملفات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-image: url('image_eedd30.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a1a24;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 2;
            margin-bottom: 20px;
        }

        h1 {
            color: #b38b4d;
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            color: #000;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 15px;
            color: #000;
        }

        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            font-family: inherit;
            transition: border-color 0.3s;
            color: #333;
        }

        input[type="file"]::file-selector-button {
            font-family: 'Tajawal', sans-serif;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        input[type="file"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #b38b4d;
        }

        button {
            background-color: #a67c3a;
            color: #fff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        button:hover {
            background-color: #8c6830;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            color: #fff;
            font-size: 13px;
            z-index: 2;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-top: 20px;
            padding-bottom: 20px;
        }

        @media (max-width: 350px) {
            h1 { font-size: 36px; }
            h2 { font-size: 18px; }
            .glass-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>بابا المجال</h1>
        <h2>أداة مضاعفة الملفات</h2>

        <div class="input-group">
            <label for="fileInput">قم برفع الملف هنا:</label>
            <input type="file" id="fileInput">
        </div>

        <div class="input-group">
            <label for="multiplier">عدد مرات التدبيل (النسخ):</label>
            <input type="number" id="multiplier" min="0" value="0">
        </div>

        <button onclick="processFile()">تنفيذ وتحميل الملف</button>
    </div>

    <div class="footer">
        © 2026 بابا المجال. جميع الحقوق محفوظة.
    </div>

    <script>
        function processFile() {
            const fileInput = document.getElementById('fileInput');
            const multiplierInput = document.getElementById('multiplier').value;
            const multiplier = parseInt(multiplierInput) || 0;

            if (fileInput.files.length === 0) {
                alert('يرجى اختيار ملف أولاً.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                let content = e.target.result;
                
                // 1. تحويل الملف بالكامل إلى صيغة CRLF (نفس وظيفة الموقع اللي بعته بالكربون)
                let normalizedContent = content.replace(/
|/g, '
');
                let crlfContent = normalizedContent.replace(/
/g, '
');
                
                // 2. إضافة فواصل CRLF في بداية الملف بناءً على الرقم المدخل (التدبيل)
                let prefixString = '';
                let namePrefix = '';
                
                if (multiplier > 0) {
                    for (let i = 0; i < multiplier; i++) {
                        prefixString += '
';
                        namePrefix += 'CRLF_';
                    }
                } else {
                    // لو الرقم 0، هيسمي الملف مرة واحدة بس CRLF_ ويعمل التحويل العادي
                    namePrefix = 'CRLF_';
                }

                // دمج الإضافات مع المحتوى المحول
                let finalContent = prefixString + crlfContent;

                // إنشاء الملف وتنزيله
                const blob = new Blob([finalContent], { type: file.type || 'text/plain' });
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                const newName = namePrefix + file.name;

                a.href = downloadUrl;
                a.download = newName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
            };

            reader.onerror = function() {
                alert('حدث خطأ أثناء قراءة الملف.');
            };

            reader.readAsText(file);
        }
    </script>

</body>
</html>
